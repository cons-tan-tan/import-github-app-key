[package]
name = "import-github-app-key"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Import GitHub App RSA private keys into AWS KMS or Google Cloud KMS"
repository = "https://github.com/cons-tan-tan/import-github-app-key"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
aes-kw = { version = "0.3.1", features = ["zeroize"] }
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
google-cloud-kms-v1 = "1"
pem-rfc7468 = { version = "0.7", features = ["std"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.9"

[dev-dependencies]
hex-literal = "1"
tempfile = "3"
wiremock = "0.6"
google-cloud-auth = "1"

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "forbid"
