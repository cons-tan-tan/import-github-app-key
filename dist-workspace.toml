[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
# The small workflow owns Nix/Hestia provisioning; dist owns build/packaging.
ci = []
hosting = ["github"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
installers = []
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
source-tarball = false
msvc-crt-static = true
